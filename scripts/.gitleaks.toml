# Extended allowlist for gitleaks in zeta-object.
# Extend (do not replace) the default rules; these are project-specific
# false-positive allowances only.
#
# Rationale:
# - docs/: plan/audit documents quote placeholder credentials when describing
#   the auth system — never real secrets.
# - *_test.go / test files: tests use literal "minioadmin"-style placeholder
#   creds to exercise SigV4.
# - config examples: config.json.example ships placeholder creds by design.
# - certs/: self-signed localhost development certificates generated by
#   `make certs` (openssl -subj /CN=localhost) and committed to history —
#   not real secrets.
# - scripts/e2e/: e2e cases exercise auth over the wire with literal
#   placeholder credentials (e.g. e2e18-ak-*), never real secrets.
#
# History note: testshim.go existed in history until 3b0a7cf moved it into the
# test-only binary (testshim_test.go, already allowlisted above). The
# historical file's symbol-alias block trips generic-api-key; the current tree
# has no such file.

[extend]
# useDefault extends gitleaks' built-in ruleset.
useDefault = true

[allowlist]
description = "zeta-object known false positives"
paths = [
  '''^docs/''',
  '''(^|/)_?test\.go$''',
  '''_test\.go$''',
  '''\.md$''',
  '''^config\.json\.example$''',
  '''^certs/''',
  '''(^|/)example''',
  '''\.sample\.json5$''',
  '''^scripts/e2e/''',
]
# The project's documented placeholder credentials (CLAUDE.md defaults).
regexes = [
  '''minioadmin''',
]

# Historical false positive: testshim.go (deleted in 3b0a7cf, content moved to
# testshim_test.go) contained a Go symbol-alias block; "gatherDelimiterKey ="
# trips generic-api-key. Certs private key is allowlisted via ^certs/ above.
commits = [
  "943b2361ee0a7e2639f2bbf790461042f23527d3",
]
