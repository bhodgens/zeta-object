# s3tests.conf — ceph/s3-tests configuration for mini-s3 (leaf 5.1).
# Points the vendored suite at a local mini-s3 instance (HTTPS, self-signed;
# ssl_verify = False makes the suite accept the temp cert).
# Credentials are mini-s3's documented defaults. Port matches the
# run-conformance.sh default; the runner regenerates the port line from
# MINIS3_CONFORMANCE_PORT when it differs.
[DEFAULT]
host = localhost
port = 18499
is_secure = True
ssl_verify = False

[fixtures]
bucket prefix = minis3-{random}-
iam name prefix = s3-tests-
iam path prefix = /s3-tests/

[s3 main]
display_name = M. Tester
user_id = testid
email = tester@ceph.com
api_name = default
access_key = minioadmin
secret_key = minioadmin

[s3 alt]
display_name = M. Tester Alta
user_id = testid-alt
email = tester-alt@ceph.com
api_name = default
access_key = minioadmin
secret_key = minioadmin

[s3 tenant]
display_name = Tenant Tester
user_id = testid-tenant
email = tester-tenant@ceph.com
api_name = default
access_key = minioadmin
secret_key = minioadmin
tenant = tenant1

# IAM sections are required by suite config parsing even though IAM/STS
# tests are deselected via markers (mini-s3 has no IAM).
[iam]
access_key = minioadmin
secret_key = minioadmin
display_name = Miner Zero
user_id = iam-user
email = miner@ceph.com

[iam root]
access_key = minioadmin
secret_key = minioadmin
display_name = Root Tester
user_id = iam-root
email = root@ceph.com

[iam alt root]
access_key = minioadmin
secret_key = minioadmin
display_name = Alt Root Tester
user_id = iam-alt-root
email = alt-root@ceph.com
