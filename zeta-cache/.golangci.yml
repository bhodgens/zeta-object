# golangci-lint configuration for the zeta-cache module.
# Mirrors the repo-root .golangci.yml baseline; zeta-cache is a separate Go
# module, so the root lint run does not reach it and this file is what
# `golangci-lint run` picks up inside zeta-cache/.

version: "2"

linters:
  enable:
    # Bugs & correctness
    - bodyclose
    - copyloopvar
    - durationcheck
    - errcheck
    - errname
    - errorlint
    - govet
    - nilerr
    - nilnesserr
    - nilnil
    - staticcheck
    - unused
    - wastedassign

    # Security
    - gosec

    # Performance
    - unconvert

    # Style & readability
    - misspell
    - intrange
    - modernize

  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
      - common-false-positives
    rules:
      - path: _test\.go
        linters:
          - bodyclose
          - errcheck
          - gosec
          - nilnil

  settings:
    gosec:
      excludes:
        # G304 (file path provided as taint input) - config and DB paths
        # are inherently user-supplied by design (same exclusion rationale
        # as the root config).
        - G304
        # G306 (file perms) - the daemon is a per-user client process; the
        # socket itself is chmod 0600 explicitly.
        - G306
        # G501 (crypto/md5 blocklist) - the wire ETag IS the body MD5
        # (plan-tree master.md "server facts"); md5 here is protocol
        # conformance, not a security primitive. Same rationale for
        # G401 (use of md5), surfaced on the same calls.
        - G501
        - G401
        # G115 (integer conversions) - FUSE attr plumbing converts
        # between uint64/int64/uint32 stat fields; values are OS stat
        # results bounded well below the overflow domain.
        - G115
        # G104 (errors unhandled) - best-effort Close/Chtimes on local
        # cache files; the error paths are EIO on an already-failing op.
        - G104

issues:
  max-issues-per-linter: 50
  max-same-issues: 5
  fix: false
