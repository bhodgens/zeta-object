name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Per-package jobs: with several sessions/packages landing concurrently, one
# in-flight package must not block another's gate. Repo-wide checks that
# cannot be split (build whole tree, tidy, secrets, e2e) stay in their own
# jobs; test/race/lint run per package via a matrix generated from the tree.

jobs:
  # Discover the package list once; the matrix consumes it.
  packages:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pkgs.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - id: pkgs
        run: |
          LIST=$(go list ./... | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "matrix={\"package\":$LIST}" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build + vet whole tree
        run: |
          go build ./...
          go vet ./...

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v6
        with:
          args: ./...

  test:
    needs: packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false # one package's red must not cancel the others' runs
      matrix: ${{ fromJSON(needs.packages.outputs.matrix) }}
    name: test ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test ${{ matrix.package }} (count=1 + race + coverage floor)
        run: |
          # Per-package coverage floor. Default 47; new/in-flight packages get a
          # starter floor - RAISE these as tests land (do not lower). When code
          # moves between packages, re-measure and update floors in the SAME
          # change (see AGENTS.md "Coverage floors move with code": the
          # 2026-09 frontend split left a stale 70 floor that broke the gate).
          case "${{ matrix.package }}" in
            mini-s3/internal/auth)             FLOOR=0 ;;  # placeholder seam interface only - RAISE when auth impl lands
            mini-s3/internal/frontend/s3)      FLOOR=24 ;; # measured 24.3% own-package after frontend-interface split - ratchet up as tests land
            *)                                 FLOOR=47 ;; # measured 47.9% aggregate floor (Makefile COVER_MIN)
          esac
          go test -count=1 -race -coverprofile=cover.out "${{ matrix.package }}"
          go tool cover -func=cover.out | tee /dev/stderr | awk -v floor="$FLOOR" -v pkg="${{ matrix.package }}" '/^total:/ {gsub(/%/,"",$3); if ($3+0 < floor) {print pkg " coverage " $3 "% below floor " floor; exit 1}}'

  # Repo-wide checks that cannot be attributed to one package.
  repo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Module tidiness
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The e2e suite drives the real AWS CLI.
      - name: Install AWS CLI v2
        run: |
          curl -sSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install --update
          aws --version

      - name: E2E suite
        run: make e2e
