name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Per-package jobs: with several sessions/packages landing concurrently, one
# in-flight package must not block another's gate. Repo-wide checks that
# cannot be split (build whole tree, tidy, secrets, e2e) stay in their own
# jobs; test/race/lint run per package via a matrix generated from the tree.

jobs:
  # Discover the package list once; the matrix consumes it.
  packages:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pkgs.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - id: pkgs
        run: |
          LIST=$(go list ./... | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "matrix={\"package\":$LIST}" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build + vet whole tree
        run: |
          go build ./...
          go vet ./...

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v7
        with:
          args: ./...
          # v2 config file requires golangci-lint v2; action v7 supports it.
          # v2.14.0 binaries are built with go1.27 and accept the go 1.26
          # module required by golang.org/x/crypto v0.56+ (govulncheck
          # GO-2026-6355/6354); v2.6.0 is go1.24-built and rejects it.
          version: v2.14.0

  test:
    needs: packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false # one package's red must not cancel the others' runs
      matrix: ${{ fromJSON(needs.packages.outputs.matrix) }}
    name: test ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test ${{ matrix.package }} (count=1 + race + coverage floor)
        run: |
          # Per-package coverage floor = measured in the CI environment
          # (golang:1.27.0 container, linux, -race) 2026-09-30, rounded down
          # to 1 decimal minus 2. RAISE as tests land (do not lower).
          # When code moves between packages, re-measure and update floors in
          # the SAME change (see AGENTS.md "Coverage floors move with code").
          # Re-measured 2026-10-04 (go1.27.0, darwin/arm64, -race) for the
          # management-api-2026-10 leaf 03 bucket-manager extraction:
          #   s3 85.0 -> floor unchanged (83); the moved create/delete logic
          #     left s3 and its new home carries its own tests, so s3 holds.
          #   root 78.8 -> floor unchanged (77); the drop is new main()-only
          #     bucket-manager wiring, which unit tests do not execute.
          #   bucketmanager 82.6 (NEW), fslock 100.0 (NEW).
          # Measured 2026-09-30 (go1.27.0, go directive 1.27.0):
          # root 79.3, auth 95.2 (type-only: floor 0), backend 93.9,
          # conformance 79.0, fsbackend 85.3, frontend 93.4, ftp 58.8,
          # s3 85.8, sftp 68.4, webdav 81.8, owncloud 89.7, metadata 89.0,
          # objectmodel 92.7.
          case "${{ matrix.package }}" in
            github.com/bhodgens/zeta-object)       FLOOR=77 ;; # measured 79.3 (re-measured 78.8 2026-10-04)
            github.com/bhodgens/zeta-object/internal/auth)                 FLOOR=0  ;; # type-only seam interface: zero executable statements (contract pinned by tests)
            github.com/bhodgens/zeta-object/internal/backend)              FLOOR=91 ;; # measured 93.9
            github.com/bhodgens/zeta-object/internal/backend/conformance)  FLOOR=77 ;; # measured 79.0 - remaining bodies are violation-reporting, proven by detection_test.go child harness
            github.com/bhodgens/zeta-object/internal/backend/fsbackend)    FLOOR=83 ;; # measured 85.3
            github.com/bhodgens/zeta-object/internal/bucketmanager)        FLOOR=80 ;; # measured 82.6 (new, 2026-10-04); RAISE as tests land
            github.com/bhodgens/zeta-object/internal/frontend)             FLOOR=91 ;; # measured 93.4
            github.com/bhodgens/zeta-object/internal/frontend/ftp)         FLOOR=56 ;; # measured 58.8
            github.com/bhodgens/zeta-object/internal/frontend/s3)          FLOOR=83 ;; # measured 85.8 (re-measured 85.0 2026-10-04)
            github.com/bhodgens/zeta-object/internal/frontend/sftp)        FLOOR=66 ;; # measured 68.4
            github.com/bhodgens/zeta-object/internal/frontend/webdav)      FLOOR=79 ;; # measured 81.8
            github.com/bhodgens/zeta-object/internal/frontend/owncloud)    FLOOR=87 ;; # measured 89.7
            github.com/bhodgens/zeta-object/internal/fslock)               FLOOR=98 ;; # measured 100.0 (new, 2026-10-04); RAISE as tests land
            github.com/bhodgens/zeta-object/internal/metadata)             FLOOR=87 ;; # measured 89.0
            github.com/bhodgens/zeta-object/internal/objectmodel)          FLOOR=90 ;; # measured 92.7
          esac
          go test -count=1 -race -coverprofile=cover.out "${{ matrix.package }}"
          go tool cover -func=cover.out | tee /dev/stderr | awk -v floor="$FLOOR" -v pkg="${{ matrix.package }}" '/^total:/ {gsub(/%/,"",$3); if ($3+0 < floor) {print pkg " coverage " $3 "% below floor " floor; exit 1}}'

  # Repo-wide checks that cannot be attributed to one package.
  repo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans a commit RANGE on push events (last-scanned..HEAD);
          # a depth-1 clone lacks the base commit and the scan dies with
          # "ambiguous argument ... unknown revision". Full history required.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Module tidiness
        run: |
          go mod verify
          go mod tidy
          # This module has no external dependencies, so go.sum does not
          # exist; tidy must not create one. Check whichever files exist.
          git diff --exit-code go.mod $(ls go.sum 2>/dev/null)
      - name: Secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        # gitleaks-action@v2 does not accept an 'args' input (it warns
        # "Unexpected input(s) 'args'" and runs its default command). It
        # auto-detects the project allowlist at the repo root .gitleaks.toml,
        # where fe26177 moved it from scripts/.gitleaks.toml.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The e2e suite drives the real AWS CLI. getfattr is the xattr
      # reader case 28 (xattr audit) uses on Linux; the ubuntu-latest
      # image does not ship it (attr package).
      - name: Install AWS CLI v2 + attr
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq attr
          curl -sSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install --update
          aws --version
          getfattr --version

      - name: E2E suite
        run: make e2e
