name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Per-package jobs: with several sessions/packages landing concurrently, one
# in-flight package must not block another's gate. Repo-wide checks that
# cannot be split (build whole tree, tidy, secrets, e2e) stay in their own
# jobs; test/race/lint run per package via a matrix generated from the tree.

jobs:
  # Discover the package list once; the matrix consumes it.
  packages:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pkgs.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - id: pkgs
        run: |
          LIST=$(go list ./... | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "matrix={\"package\":$LIST}" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build + vet whole tree
        run: |
          go build ./...
          go vet ./...

      # zeta-cache is a SEPARATE Go module (zeta-cache/); the root build
      # above does not reach it. CGO_ENABLED=0 proves the repo-wide no-cgo
      # law (SQLite via modernc.org/sqlite).
      - name: Build zeta-cache module (CGO_ENABLED=0)
        run: |
          cd zeta-cache
          go build ./...
          go vet ./...
          CGO_ENABLED=0 go build -o ../zeta-cache-bin .

  # zeta-cache had build + lint gates but NO test gate anywhere (bughunt
  # 2026-10-13 H12): the coverage matrix is generated from the ROOT module's
  # `go list ./...`, which does not reach the zeta-cache/ module, so its
  # `go test` never ran in CI. Same triggers as the other test jobs
  # (push main + PR); race, matching the matrix's gate; CGO_ENABLED=0 proves
  # the module keeps honoring the repo-wide no-cgo law.
  zeta-cache-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: zeta-cache/go.mod
      # The gate itself is `make zeta-cache-test-race` — the SAME target
      # `make check` runs locally (race + count=1 + coverage profile +
      # aggregate floor, CGO_ENABLED=0), so CI and the local gate cannot
      # drift (W2 LOW). The floor value and its measurement provenance live
      # in the Makefile next to the target.
      # MEASURED 2026-10-14 (darwin/arm64, go1.27.x, -race AND non-race
      # both — race changed the number by only 0.1): module aggregate
      # 61.5-61.6% (floor 59). Per-package at the same run: config 88.1,
      # fusefs 63.2, index 67.4, ipc 74.9, scheduler 75.8, sync 80.2,
      # transport 43.4, root main 42.3, cmd/* 0 (main-only).
      # RAISE as tests land (do not lower). A toolchain bump in
      # zeta-cache/go.mod is a coverage event: re-measure in the SAME
      # change (see the root matrix's coverage-is-toolchain-dependent
      # note — the same law applies to this module).
      - name: Test zeta-cache module (count=1 + race + coverage floor, CGO_ENABLED=0)
        run: make zeta-cache-test-race

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v7
        with:
          args: ./...
          # v2 config file requires golangci-lint v2; action v7 supports it.
          # v2.14.0 binaries are built with go1.27 and accept the go 1.26
          # module required by golang.org/x/crypto v0.56+ (govulncheck
          # GO-2026-6355/6354); v2.6.0 is go1.24-built and rejects it.
          version: v2.14.0

      # zeta-cache is its own module, so the root lint run does not cover
      # it. It carries its own .golangci.yml (mirror of the root baseline).
      - name: Lint zeta-cache module (golangci-lint)
        uses: golangci/golangci-lint-action@v7
        with:
          working-directory: zeta-cache
          args: ./...
          version: v2.14.0

  test:
    needs: packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false # one package's red must not cancel the others' runs
      matrix: ${{ fromJSON(needs.packages.outputs.matrix) }}
    name: test ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test ${{ matrix.package }} (count=1 + race + coverage floor)
        run: |
          # Per-package coverage floor = measured in the CI environment
          # (golang:1.27.0 container, linux, -race) 2026-09-30, rounded down
          # to 1 decimal minus 2. RAISE as tests land (do not lower).
          # When code moves between packages, re-measure and update floors in
          # the SAME change (see AGENTS.md "Coverage floors move with code").
          # RE-MEASURED 2026-10-11 (go1.27.2, linux) after the toolchain bump
          # in 806eea9. Every floor below is that run's OWN number minus 1, and
          # the reason matters more than the numbers: the floors were correct,
          # and 17 of 24 packages still had their coverage, but FOUR went RED
          # (frontend/s3, backend/fsbackend, backend/conformance,
          # adminserver/gateway) with NO code change in those packages. The only
          # variable was the COMPILER: the previous green run built with
          # go1.27.0, that one with go1.27.2, because `toolchain go1.27.2` in
          # go.mod feeds setup-go's go-version-file. Coverage instrumentation
          # moved with the compiler, by 0.2 to 2.6 points per package
          # (s3 83.2 -> 81.4, gateway 80.2 -> 77.6).
          #
          # So COVERAGE IS TOOLCHAIN-DEPENDENT, not merely platform-dependent.
          # A compiler bump is a coverage event: re-measure every floor in the
          # SAME change that moves go.mod's go/toolchain directive, or the next
          # bump red-lines packages nobody touched.
          #
          # Margin is 1 point rather than the 2 used before, because on a FIXED
          # toolchain the measurement is bit-stable: 7 of 24 packages were
          # byte-identical between the two runs and the movers moved only with
          # the compiler. The noise was never sampling - it was the toolchain.
          # Re-measured 2026-10-04 (go1.27.0, darwin/arm64, -race) for the
          # management-api-2026-10 leaf 03 bucket-manager extraction:
          #   s3 85.0 -> floor unchanged (83); the moved create/delete logic
          #     left s3 and its new home carries its own tests, so s3 holds.
          #   root 78.8 -> floor unchanged (77); the drop is new main()-only
          #     bucket-manager wiring, which unit tests do not execute.
          #   bucketmanager 82.6 (NEW), fslock 100.0 (NEW).
          # Re-measured 2026-10-04 (go1.27.0, darwin/arm64) for the
          # admin-server-2026-10 leaf 01 console package:
          #   adminserver 86.7 (NEW, cmd/admin-server is main-only -> 0.0).
          # Measured 2026-09-30 (go1.27.0, go directive 1.27.0):
          # root 79.3, auth 95.2 (type-only: floor 0), backend 93.9,
          # conformance 79.0, fsbackend 85.3, frontend 93.4, ftp 58.8,
          # s3 85.8, sftp 68.4, webdav 81.8, owncloud 89.7, metadata 89.0,
          # objectmodel 92.7.
          case "${{ matrix.package }}" in
            github.com/bhodgens/zeta-object) FLOOR=81 ;; # measured 82.7 (2026-10-11, linux, go1.27.2)
            github.com/bhodgens/zeta-object/internal/auth) FLOOR=90 ;; # measured 91.1 (2026-10-11, linux, go1.27.2)
            github.com/bhodgens/zeta-object/internal/backend) FLOOR=92 ;; # measured 93.9 (2026-10-11, linux, go1.27.2)
            github.com/bhodgens/zeta-object/internal/backend/conformance) FLOOR=75 ;; # measured 76.6 (2026-10-11, linux, go1.27.2)
            github.com/bhodgens/zeta-object/internal/backend/fsbackend) FLOOR=80 ;; # measured 81.6 (2026-10-11, linux, go1.27.2)
            github.com/bhodgens/zeta-object/internal/bucketmanager) FLOOR=86 ;; # measured 87.8 (2026-10-11, linux, go1.27.2)
            github.com/bhodgens/zeta-object/internal/frontend) FLOOR=91 ;; # measured 92.2 (2026-10-11, linux, go1.27.2)
            github.com/bhodgens/zeta-object/internal/frontend/ftp) FLOOR=66 ;; # measured 67.1 (2026-10-11, linux, go1.27.2)
            github.com/bhodgens/zeta-object/internal/frontend/s3) FLOOR=80 ;; # measured 81.4 (2026-10-11, linux, go1.27.2)
            github.com/bhodgens/zeta-object/internal/frontend/sftp) FLOOR=67 ;; # measured 68.7 (2026-10-11, linux, go1.27.2)
            github.com/bhodgens/zeta-object/internal/frontend/webdav) FLOOR=83 ;; # measured 84.0 (2026-10-11, linux, go1.27.2)
            github.com/bhodgens/zeta-object/internal/frontend/owncloud) FLOOR=92 ;; # measured 93.6 (2026-10-11, linux, go1.27.2)
            github.com/bhodgens/zeta-object/internal/fslock) FLOOR=99 ;; # measured 100.0 (2026-10-11, linux, go1.27.2)
            github.com/bhodgens/zeta-object/internal/metadata) FLOOR=91 ;; # measured 92.1 (2026-10-11, linux, go1.27.2)
            github.com/bhodgens/zeta-object/internal/objectmodel) FLOOR=91 ;; # measured 92.6 (2026-10-11, linux, go1.27.2)
            github.com/bhodgens/zeta-object/internal/adminserver) FLOOR=86 ;; # measured 87.1 (2026-10-11, linux, go1.27.2)
            github.com/bhodgens/zeta-object/cmd/admin-server)              FLOOR=0  ;; # main-only console binary wiring: not unit-tested
            # --- floors added 2026-10-10 (audit G8) ---
            # These 7 packages were in the CI matrix (built from `go list ./...`)
            # with NO case in the block above. An unset FLOOR reaches the awk
            # check as the empty string, which compares as 0 - so a package with
            # 80% coverage and a package with none were gated identically. CI has
            # been running these jobs and enforcing nothing. Floors are CI's own
            # linux numbers from the green run 37990770019, minus 2.
            #
            # 2026-10-22 appliance merge: main and the appliance branch each
            # re-measured these 5 packages since the G8 audit, and the merged
            # tree (union of both test sets) has not been measured on linux
            # yet. Until the CI floor job re-measures, gate on the MIN of the
            # two branches' floors - the only value guaranteed not to exceed
            # the merged tree's coverage. Ratchet each back up to the
            # CI-measured number in the next change that touches the package
            # (AGENTS.md "floors move with code").
            github.com/bhodgens/zeta-object/internal/adminserver/gateway) FLOOR=76 ;; # min(main 76 @77.6, appliance 78 @80.2); re-measure post-merge
            github.com/bhodgens/zeta-object/internal/batchops) FLOOR=86 ;; # min(main 87 @88.4, appliance 86 @88.4); re-measure post-merge
            github.com/bhodgens/zeta-object/internal/frontend/admin) FLOOR=83 ;; # both branches 83 (main @84.9, appliance @85.2)
            github.com/bhodgens/zeta-object/internal/frontend/autherr) FLOOR=98 ;; # min(main 99 @100.0, appliance 98 @100.0)
            github.com/bhodgens/zeta-object/internal/frontend/h3) FLOOR=89 ;; # both branches 89 (main @90.7, appliance @91.0)
            github.com/bhodgens/zeta-object/internal/frontend/sts) FLOOR=60 ;; # appliance-only pkg (leaf 02 sts); measured 62.6; mTLS listener paths e2e-covered, resolver via s3; RAISE as tests land
            # main-only probe/fixture programs: exercised by their e2e cases,
            # not by unit tests. FLOOR=0 is correct for these, stated on purpose.
            github.com/bhodgens/zeta-object/scripts/e2e/h3probe)            FLOOR=0  ;; # main-only e2e probe binary; run by scripts/e2e, not unit-tested
            github.com/bhodgens/zeta-object/scripts/e2e/fixtures/zmetad-fixture) FLOOR=0 ;; # main-only e2e fixture binary; run by scripts/e2e, not unit-tested
          esac
          # A package that reaches the matrix without a floor above is a silent
          # hole: FLOOR='' compares as 0, so the job passes whatever it measures.
          # Fail loudly instead of under-gating.
          if [ -z "${FLOOR:-}" ]; then
            echo "ERROR: no coverage floor for ${{ matrix.package }} - add a case to the block above"
            exit 1
          fi
          if [ "${{ matrix.package }}" = "github.com/bhodgens/zeta-object/internal/frontend/s3" ]; then
            # s3 special case (3 consecutive runner reclaims at ~107s on race+cover, 2026-10-06):
            # run the race gate WITHOUT -coverprofile (race+cover is the slowest combo and the
            # only matrix entry that died), then coverage WITHOUT -race. Same two gates, one
            # package, two lighter processes.
            go test -count=1 -race ./internal/frontend/s3
            go test -count=1 -coverprofile=cover.out ./internal/frontend/s3
          else
            go test -count=1 -race -coverprofile=cover.out "${{ matrix.package }}"
          fi
          go tool cover -func=cover.out | tee /dev/stderr | awk -v floor="$FLOOR" -v pkg="${{ matrix.package }}" '/^total:/ {gsub(/%/,"",$3); if ($3+0 < floor) {print pkg " coverage " $3 "% below floor " floor; exit 1}}'

  # Repo-wide checks that cannot be attributed to one package.
  repo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans a commit RANGE on push events (last-scanned..HEAD);
          # a depth-1 clone lacks the base commit and the scan dies with
          # "ambiguous argument ... unknown revision". Full history required.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Module tidiness
        run: |
          go mod verify
          go mod tidy
          # This module has no external dependencies, so go.sum does not
          # exist; tidy must not create one. Check whichever files exist.
          git diff --exit-code go.mod $(ls go.sum 2>/dev/null)
      # The two honesty pins never ran in CI (bughunt 2026-10-13 L36):
      # precommit ran them locally, but this workflow's only `make` call was
      # `make e2e` - so a broken skip-reporting pin or floor-guard pin could
      # not turn a green run red. Both are pure file/logic checks, no build.
      - name: Honesty pins (e2e skip reporting + CI floor guard)
        run: make e2e-report-test ci-floor-test
      - name: Secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        # gitleaks-action@v2 does not accept an 'args' input (it warns
        # "Unexpected input(s) 'args'" and runs its default command). It
        # auto-detects the project allowlist at the repo root .gitleaks.toml,
        # where fe26177 moved it from scripts/.gitleaks.toml.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The e2e suite drives the real AWS CLI. getfattr is the xattr
      # reader case 28 (xattr audit) uses on Linux; the ubuntu-latest
      # image does not ship it (attr package). fuse3 is the mount
      # helper case 40's live FUSE section needs (the device node alone
      # is not enough for an unprivileged fusermount).
      - name: Install AWS CLI v2 + attr + fuse3
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq attr fuse3
          curl -sSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install --update
          aws --version
          getfattr --version

      # Case 40 shells out to the zeta-cache binary and builds it from its
      # own module (zeta-cache/go.mod); setup-go installed the toolchain
      # from the root go.mod, which declares the same go 1.27.0, so the
      # in-case build just works. Verify that here so a future toolchain
      # split fails here, not mid-case.
      - name: Build zeta-cache for case 40
        run: cd zeta-cache && go build ./...

      - name: E2E suite
        run: make e2e
