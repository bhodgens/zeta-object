name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Per-package jobs: with several sessions/packages landing concurrently, one
# in-flight package must not block another's gate. Repo-wide checks that
# cannot be split (build whole tree, tidy, secrets, e2e) stay in their own
# jobs; test/race/lint run per package via a matrix generated from the tree.

jobs:
  # Discover the package list once; the matrix consumes it.
  packages:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pkgs.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - id: pkgs
        run: |
          LIST=$(go list ./... | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "matrix={\"package\":$LIST}" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build + vet whole tree
        run: |
          go build ./...
          go vet ./...

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v7
        with:
          args: ./...
          # v2 config file requires golangci-lint v2; action v7 supports it.
          # v2.4.0 adds go1.25 support (v2.1.6 binaries are go1.24-built and
          # reject a go 1.25.6 module); v2.6.0 adds the 'modernize' linter
          # the config enables.
          version: v2.6.0

  test:
    needs: packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false # one package's red must not cancel the others' runs
      matrix: ${{ fromJSON(needs.packages.outputs.matrix) }}
    name: test ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test ${{ matrix.package }} (count=1 + race + coverage floor)
        run: |
          # Per-package coverage floor = measured on CI (ubuntu, go1.25.6,
          # -race) 2026-09-30, rounded down to 1 decimal minus 2. Local macOS
          # (go1.27) measures ~2.4pts higher; the floor must match the CI
          # environment that enforces it. RAISE as tests land (do not lower).
          # When code moves between packages, re-measure and update floors in
          # the SAME change (see AGENTS.md "Coverage floors move with code").
          case "${{ matrix.package }}" in
            github.com/bhodgens/zeta-object)       FLOOR=85 ;; # CI measured 87.7
            github.com/bhodgens/zeta-object/internal/auth)                 FLOOR=0  ;; # type-only seam interface: zero executable statements (contract pinned by tests)
            github.com/bhodgens/zeta-object/internal/backend)              FLOOR=92 ;; # CI measured 94.1
            github.com/bhodgens/zeta-object/internal/backend/conformance)  FLOOR=74 ;; # CI measured 76.9 - remaining bodies are violation-reporting, proven by detection_test.go child harness
            github.com/bhodgens/zeta-object/internal/backend/fsbackend)    FLOOR=81 ;; # CI measured 83.1
            github.com/bhodgens/zeta-object/internal/frontend)             FLOOR=91 ;; # CI measured 93.7
            github.com/bhodgens/zeta-object/internal/frontend/s3)          FLOOR=81 ;; # CI measured 83.8
            github.com/bhodgens/zeta-object/internal/metadata)             FLOOR=85 ;; # CI measured 87.6
            github.com/bhodgens/zeta-object/internal/objectmodel)          FLOOR=90 ;; # CI measured 92.4
          esac
          go test -count=1 -race -coverprofile=cover.out "${{ matrix.package }}"
          go tool cover -func=cover.out | tee /dev/stderr | awk -v floor="$FLOOR" -v pkg="${{ matrix.package }}" '/^total:/ {gsub(/%/,"",$3); if ($3+0 < floor) {print pkg " coverage " $3 "% below floor " floor; exit 1}}'

  # Repo-wide checks that cannot be attributed to one package.
  repo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Module tidiness
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The e2e suite drives the real AWS CLI.
      - name: Install AWS CLI v2
        run: |
          curl -sSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install --update
          aws --version

      - name: E2E suite
        run: make e2e
